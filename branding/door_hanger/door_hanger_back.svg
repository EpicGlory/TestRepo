<!-- Clean and Green door hanger BACK. 4.25 x 11 in (850 x 2200 at 200dpi). -->
<svg viewBox="0 0 850 2200" xmlns="http://www.w3.org/2000/svg">
  <rect width="850" height="2200" fill="#F4F4EF"/>

  <!-- Top mow-stripe band -->
  <rect x="0" y="0" width="850" height="20" fill="#A5D6A7"/>
  <rect x="0" y="20" width="850" height="20" fill="#2E7D32"/>
  <rect x="0" y="40" width="850" height="20" fill="#1B4D1F"/>

  <!-- Die-cut guide -->
  <circle cx="425" cy="200" r="150" fill="none" stroke="#BBBBBB" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="425" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#BBBBBB" letter-spacing="2">DIE-CUT</text>

  <!-- Headline -->
  <text x="425" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#1B4D1F" letter-spacing="-1">Seed vs. Sod.</text>
  <text x="425" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#2E7D32" letter-spacing="-1">The honest version.</text>

  <!-- Comparison table -->
  <g transform="translate(40,520)">
    <!-- Header row -->
    <rect x="0" y="0" width="770" height="42" fill="#1B4D1F"/>
    <text x="220" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#F4F4EF" letter-spacing="3">SEEDING</text>
    <text x="550" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#F4F4EF" letter-spacing="3">SODDING</text>

    <!-- Row 1 -->
    <rect x="0" y="42" width="770" height="46" fill="#FFFFFF"/>
    <text x="8" y="71" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#666666">COST  (5,000 sq ft)</text>
    <text x="220" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B4D1F">~$2,000-3,000</text>
    <text x="550" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2C2C2C">~$10,000-15,000</text>

    <!-- Row 2 -->
    <rect x="0" y="88" width="770" height="46" fill="#F4F4EF"/>
    <text x="8" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#666666">TIME TO LAWN</text>
    <text x="220" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2C2C2C">4-8 weeks</text>
    <text x="550" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B4D1F">Same day</text>

    <!-- Row 3 -->
    <rect x="0" y="134" width="770" height="46" fill="#FFFFFF"/>
    <text x="8" y="163" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#666666">GRASS TYPE</text>
    <text x="220" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#1B4D1F">Tall fescue (drought-tough)</text>
    <text x="550" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2C">Mostly Kentucky bluegrass</text>

    <!-- Row 4 -->
    <rect x="0" y="180" width="770" height="46" fill="#F4F4EF"/>
    <text x="8" y="209" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#666666">WATER USE  (long term)</text>
    <text x="220" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B4D1F">~30% less</text>
    <text x="550" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2C2C2C">High in Utah summers</text>

    <!-- Row 5 -->
    <rect x="0" y="226" width="770" height="46" fill="#FFFFFF"/>
    <text x="8" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#666666">ROOT DEPTH  (year 1)</text>
    <text x="220" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B4D1F">8-12 in</text>
    <text x="550" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2C2C2C">4-6 in</text>

    <!-- Row 6 -->
    <rect x="0" y="272" width="770" height="46" fill="#F4F4EF"/>
    <text x="8" y="301" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#666666">PLASTIC NETTING</text>
    <text x="220" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B4D1F">None</text>
    <text x="550" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2C2C2C">Usually yes, in soil</text>
  </g>

  <!-- 3 reasons callout -->
  <g transform="translate(40,870)">
    <text x="385" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B4D1F" letter-spacing="0.5">3 reasons seeding wins for Utah:</text>

    <circle cx="22" cy="35" r="7" fill="#2E7D32"/>
    <text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#2E7D32" letter-spacing="1">RIGHT GRASS.</text>
    <text x="180" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2C2C2C">Valkyrie tall fescue is bred for hot, dry climates.</text>

    <circle cx="22" cy="65" r="7" fill="#2E7D32"/>
    <text x="40" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#2E7D32" letter-spacing="1">30% LESS WATER.</text>
    <text x="200" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2C2C2C">Deeper roots find moisture below.</text>

    <circle cx="22" cy="95" r="7" fill="#2E7D32"/>
    <text x="40" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#2E7D32" letter-spacing="1">NO FOOTPRINT.</text>
    <text x="180" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2C2C2C">Sod travels by truck. Seed travels in a 50-lb bag.</text>
  </g>

  <!-- Self-assessment -->
  <g transform="translate(40,1020)">
    <text x="385" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B4D1F">What does YOUR lawn look like?</text>

    <rect x="0" y="20" width="770" height="44" fill="#FFFFFF"/>
    <rect x="0" y="20" width="14" height="44" fill="#A5D6A7"/>
    <text x="28" y="49" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">MOSTLY GREEN, JUST TIRED</text>
    <text x="765" y="49" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="13" font-weight="700" fill="#2E7D32">→ Summer Lawn Rescue</text>

    <rect x="0" y="68" width="770" height="44" fill="#FFFFFF"/>
    <rect x="0" y="68" width="14" height="44" fill="#FFC107"/>
    <text x="28" y="97" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">PATCHY, THINNING</text>
    <text x="765" y="97" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="13" font-weight="700" fill="#2E7D32">→ Fall Overseeding</text>

    <rect x="0" y="116" width="770" height="44" fill="#FFFFFF"/>
    <rect x="0" y="116" width="14" height="44" fill="#B71C1C"/>
    <text x="28" y="145" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">MOSTLY WEEDS OR BARE</text>
    <text x="765" y="145" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="13" font-weight="700" fill="#2E7D32">→ Fall Renovation</text>

    <rect x="0" y="164" width="770" height="44" fill="#FFFFFF"/>
    <rect x="0" y="164" width="14" height="44" fill="#666666"/>
    <text x="28" y="193" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">NOT SURE</text>
    <text x="765" y="193" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="13" font-weight="700" fill="#2E7D32">→ Free Walk-Through</text>
  </g>

  <!-- Service ladder -->
  <g transform="translate(40,1280)">
    <text x="385" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#1B4D1F" letter-spacing="0.5">Three ways we make your lawn the best on the block:</text>

    <g transform="translate(0,20)">
      <rect x="0" y="0" width="770" height="66" fill="#FFFFFF"/>
      <rect x="0" y="0" width="6" height="66" fill="#A5D6A7"/>
      <text x="18" y="22" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">SUMMER LAWN RESCUE</text>
      <text x="18" y="40" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Soil test  ·  K boost  ·  Biostimulants  ·  Custom fertilizer program</text>
      <text x="18" y="56" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11" fill="#2E7D32">Available year-round.</text>
    </g>

    <g transform="translate(0,98)">
      <rect x="0" y="0" width="770" height="66" fill="#FFFFFF"/>
      <rect x="0" y="0" width="6" height="66" fill="#FFC107"/>
      <text x="18" y="22" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">FALL OVERSEEDING</text>
      <text x="18" y="40" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Aerate  ·  Valkyrie seed  ·  Starter feed  ·  Tenacity weed control</text>
      <text x="18" y="56" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11" fill="#2E7D32">Aug-Oct only.</text>
    </g>

    <g transform="translate(0,176)">
      <rect x="0" y="0" width="770" height="66" fill="#FFFFFF"/>
      <rect x="0" y="0" width="6" height="66" fill="#1B4D1F"/>
      <text x="18" y="22" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1B4D1F" letter-spacing="1">FALL RENOVATION</text>
      <text x="18" y="40" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Full 4-phase kill &amp; reseed  ·  Premium Valkyrie  ·  8 slots / season</text>
      <text x="18" y="56" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11" fill="#2E7D32">Aug-Oct only  ·  Book by July 15.</text>
    </g>

    <!-- Sprinkler audit gate -->
    <g transform="translate(0,260)">
      <rect x="0" y="0" width="770" height="56" fill="#1B4D1F"/>
      <rect x="0" y="0" width="770" height="3" fill="#FFC107"/>
      <rect x="0" y="53" width="770" height="3" fill="#FFC107"/>
      <text x="385" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFC107" letter-spacing="2">SPRINKLER AUDIT REQUIRED FOR SEEDING  ·  $125</text>
      <text x="385" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="10" fill="#F4F4EF">Passing audit = guaranteed germination. We do the audit + any repairs ourselves.</text>
    </g>
  </g>

  <!-- Final CTA -->
  <g transform="translate(40,1690)">
    <text x="385" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#1B4D1F" letter-spacing="3">CALL RYAN  ·  OWNER</text>
    <text x="385" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1B4D1F">801.358.7820</text>
    <text x="385" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="13" fill="#666666">rptucker@gmail.com  ·  Kaysville, UT  ·  Serving Davis County</text>

    <rect x="100" y="110" width="570" height="60" fill="#FFC107"/>
    <text x="385" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#1B4D1F" letter-spacing="3">FREE $50 SOIL TEST</text>
    <text x="385" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1B4D1F">with any service signup  ·  mention this door hanger</text>
  </g>

  <!-- Bottom mow stripes + tagline -->
  <rect x="0" y="1990" width="850" height="22" fill="#A5D6A7"/>
  <rect x="0" y="2012" width="850" height="22" fill="#2E7D32"/>
  <rect x="0" y="2034" width="850" height="22" fill="#1B4D1F"/>

  <text x="425" y="2110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="26" font-weight="700" letter-spacing="3" fill="#2E7D32">Seed.  Feed.  Succeed.</text>
  <text x="425" y="2150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#999999">CLEAN AND GREEN  ·  TURF CARE AND RENOVATION</text>
</svg>
