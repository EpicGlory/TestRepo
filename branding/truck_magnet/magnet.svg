<!-- Truck magnet: 24" x 12" (2:1). Side door panels (driver + passenger). -->
<!-- Black background for stealth-luxe on dark forest green Ford Excursion. -->
<!-- v2: removed top/bottom mow stripes, added "Want green turf in July?" hook. -->
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#1A1A1A"/>

  <!-- Hook line (top) -->
  <text x="600" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="32" font-weight="700" letter-spacing="1" fill="#FFC107">Want green turf in July?</text>

  <!-- Brand wordmark -->
  <text x="600" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-2">CLEAN AND</text>
  <text x="600" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#A5D6A7" letter-spacing="-2">GREEN TURF</text>

  <!-- Mow stripes (mid — brand cue) -->
  <rect x="220" y="238" width="760" height="9" fill="#A5D6A7"/>
  <rect x="220" y="247" width="760" height="9" fill="#2E7D32"/>
  <rect x="220" y="256" width="760" height="9" fill="#1B4D1F"/>

  <!-- Descriptor -->
  <text x="600" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#A5D6A7">RENOVATION AND LAWN CARE</text>

  <!-- BIG PHONE -->
  <text x="600" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="-2">801.358.7820</text>

  <!-- Website -->
  <text x="600" y="475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#A5D6A7">cleanandgreenturf.com</text>

  <!-- Tagline + service area (bottom) -->
  <text x="600" y="525" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="18" font-weight="700" letter-spacing="3" fill="#A5D6A7">Seed.  Feed.  Succeed.</text>
  <text x="600" y="565" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#888">KAYSVILLE, UT  ·  SERVING DAVIS COUNTY</text>
</svg>
