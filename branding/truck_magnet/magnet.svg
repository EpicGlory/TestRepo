<!-- Truck magnet: 24" x 12" (2:1 horizontal). Designed for Ryan's dark forest green -->
<!-- Ford Excursion door panel. Black background for stealth-luxe contrast. -->
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#1A1A1A"/>

  <!-- Top thin mow stripes for brand recognition even from a distance -->
  <rect x="0" y="0" width="1200" height="10" fill="#A5D6A7"/>
  <rect x="0" y="10" width="1200" height="10" fill="#2E7D32"/>

  <!-- Brand wordmark -->
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="900" fill="#FFFFFF" letter-spacing="-2">CLEAN AND</text>
  <text x="600" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="900" fill="#A5D6A7" letter-spacing="-2">GREEN TURF</text>

  <!-- Mow stripes (in original brand greens — still visible on black) -->
  <rect x="200" y="240" width="800" height="9" fill="#A5D6A7"/>
  <rect x="200" y="249" width="800" height="9" fill="#2E7D32"/>
  <rect x="200" y="258" width="800" height="9" fill="#1B4D1F"/>

  <!-- Descriptor -->
  <text x="600" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#A5D6A7">RENOVATION AND LAWN CARE</text>

  <!-- BIG PHONE -->
  <text x="600" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="-2">801.358.7820</text>

  <!-- Website -->
  <text x="600" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#A5D6A7">cleanandgreenturf.com</text>

  <!-- Tagline + location -->
  <text x="600" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="18" font-weight="700" letter-spacing="3" fill="#FFC107">Seed.  Feed.  Succeed.</text>
  <text x="600" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#888">KAYSVILLE, UT  ·  SERVING DAVIS COUNTY</text>

  <!-- Bottom mow stripes -->
  <rect x="0" y="580" width="1200" height="10" fill="#2E7D32"/>
  <rect x="0" y="590" width="1200" height="10" fill="#A5D6A7"/>
</svg>
