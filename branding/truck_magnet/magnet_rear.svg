<!-- Rear-of-vehicle magnet: 24" x 18". For Ford Excursion rear cargo door. -->
<!-- Phone-dominant for captive audiences at red lights, drive-thrus, parking lots. -->
<!-- v2: removed top/bottom mow stripes, replaced "Bad lawn? Call us." with -->
<!-- the consistent brand hook "Want green turf in July?" -->
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#1A1A1A"/>

  <!-- Hook line (top) - bigger on rear magnet -->
  <text x="600" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="44" font-weight="700" letter-spacing="1" fill="#FFC107">Want green turf in July?</text>

  <!-- Brand wordmark -->
  <text x="600" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-2">CLEAN AND</text>
  <text x="600" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#A5D6A7" letter-spacing="-2">GREEN TURF</text>

  <!-- Descriptor -->
  <text x="600" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#A5D6A7">RENOVATION AND LAWN CARE</text>

  <!-- Divider -->
  <line x1="240" y1="345" x2="960" y2="345" stroke="#444" stroke-width="2"/>

  <!-- MASSIVE PHONE NUMBER -->
  <text x="600" y="510" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" letter-spacing="-4">801.358.7820</text>

  <!-- Website -->
  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#A5D6A7">cleanandgreenturf.com</text>

  <!-- Yellow CTA bar (bottom bookend to top hook) -->
  <rect x="200" y="650" width="800" height="70" fill="#FFC107"/>
  <text x="600" y="697" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="3" fill="#1B4D1F">FREE LAWN ASSESSMENT</text>

  <!-- Tagline -->
  <text x="600" y="780" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="24" font-weight="700" letter-spacing="3" fill="#A5D6A7">Seed.  Feed.  Succeed.</text>

  <!-- Service area -->
  <text x="600" y="830" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#888">KAYSVILLE, UT  ·  SERVING DAVIS COUNTY</text>
</svg>
