<!-- Rear-of-vehicle magnet: 24" x 18". Phone-dominant for captive audiences -->
<!-- at red lights, drive-thrus, and parking lots. Black bg, matches sides. -->
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#1A1A1A"/>

  <!-- Top mow stripes -->
  <rect x="0" y="0" width="1200" height="12" fill="#A5D6A7"/>
  <rect x="0" y="12" width="1200" height="12" fill="#2E7D32"/>
  <rect x="0" y="24" width="1200" height="12" fill="#1B4D1F"/>

  <!-- Brand wordmark (smaller than sides — phone is hero) -->
  <text x="600" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-2">CLEAN AND</text>
  <text x="600" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#A5D6A7" letter-spacing="-2">GREEN TURF</text>

  <!-- Descriptor -->
  <text x="600" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#A5D6A7">RENOVATION AND LAWN CARE</text>

  <!-- Divider -->
  <line x1="200" y1="285" x2="1000" y2="285" stroke="#444" stroke-width="2"/>

  <!-- "BAD LAWN?" hook -->
  <text x="600" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" font-style="italic" fill="#A5D6A7">Bad lawn? Call us.</text>

  <!-- MASSIVE PHONE NUMBER -->
  <text x="600" y="510" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" letter-spacing="-4">801.358.7820</text>

  <!-- Website -->
  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#A5D6A7">cleanandgreenturf.com</text>

  <!-- Yellow CTA bar -->
  <rect x="200" y="650" width="800" height="70" fill="#FFC107"/>
  <text x="600" y="697" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="3" fill="#1B4D1F">FREE LAWN ASSESSMENT</text>

  <!-- Tagline -->
  <text x="600" y="780" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="24" font-weight="700" letter-spacing="3" fill="#A5D6A7">Seed.  Feed.  Succeed.</text>

  <!-- Service area -->
  <text x="600" y="830" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#888">KAYSVILLE, UT  ·  SERVING DAVIS COUNTY</text>

  <!-- Bottom mow stripes -->
  <rect x="0" y="864" width="1200" height="12" fill="#1B4D1F"/>
  <rect x="0" y="876" width="1200" height="12" fill="#2E7D32"/>
  <rect x="0" y="888" width="1200" height="12" fill="#A5D6A7"/>
</svg>
