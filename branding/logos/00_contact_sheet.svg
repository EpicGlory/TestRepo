<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="1200" fill="#FFFFFF"/>
  <text x="500" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B4D1F">Clean and Green Lawn Care  ·  10 Logo Concepts</text>
  <text x="500" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">v1 — explorations against brand v1.0 palette</text>

  <!-- Helper: each tile is 480x220 with a 20px label band -->
  <!-- Row layout: 2 columns x 5 rows, 480 wide tiles, padding 20 -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2C2C2C">
    <!-- 01 -->
    <g transform="translate(20,90)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <g transform="scale(0.96)">
        <path d="M 90 175 Q 70 100 110 55 Q 140 80 130 145 Q 125 170 90 175 Z" fill="#2E7D32"/>
        <path d="M 135 175 Q 130 95 165 55 Q 200 95 175 150 Q 160 172 135 175 Z" fill="#1B4D1F"/>
        <text x="220" y="100" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#1B4D1F">Clean and Green</text>
        <text x="220" y="130" font-family="Georgia, serif" font-size="14" letter-spacing="6" fill="#2E7D32">LAWN CARE</text>
      </g>
      <text x="10" y="195" font-weight="700">01 — Interlocking Blades + Serif Wordmark</text>
    </g>
    <!-- 02 -->
    <g transform="translate(500,90)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <circle cx="105" cy="105" r="70" fill="#2E7D32"/>
      <circle cx="105" cy="105" r="80" fill="none" stroke="#1B4D1F" stroke-width="3"/>
      <path d="M 105 150 Q 95 120 100 80 Q 110 70 115 80 Q 120 120 105 150 Z" fill="#A5D6A7"/>
      <text x="200" y="95" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1B4D1F">CLEAN AND GREEN</text>
      <text x="200" y="120" font-family="Georgia, serif" font-size="14" letter-spacing="6" fill="#2E7D32">LAWN CARE</text>
      <text x="200" y="145" font-family="Helvetica" font-size="10" letter-spacing="2" fill="#666">EST. 2026  ·  LOCALLY OWNED</text>
      <text x="10" y="195" font-weight="700">02 — Heritage Crest</text>
    </g>
    <!-- 03 -->
    <g transform="translate(20,310)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <text x="230" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1B4D1F">CLEAN &amp; GREEN</text>
      <rect x="50" y="100" width="360" height="12" fill="#A5D6A7"/>
      <rect x="50" y="112" width="360" height="12" fill="#2E7D32"/>
      <rect x="50" y="124" width="360" height="12" fill="#1B4D1F"/>
      <text x="230" y="160" text-anchor="middle" font-family="Helvetica" font-size="13" letter-spacing="6" fill="#2C2C2C">LAWN CARE</text>
