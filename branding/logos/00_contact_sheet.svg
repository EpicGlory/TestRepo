      <text x="195" y="95" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#1B4D1F">Clean and Green</text>
      <text x="195" y="120" font-family="Helvetica" font-size="12" letter-spacing="6" fill="#2E7D32">LAWN CARE</text>
      <text x="195" y="145" font-family="Helvetica" font-style="italic" font-size="11" fill="#666">Grow it right.</text>
      <text x="10" y="195" font-weight="700">08 — Three Blades / Growth</text>
    </g>
    <!-- 09 -->
    <g transform="translate(20,970)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <circle cx="105" cy="105" r="72" fill="#1B4D1F"/>
      <circle cx="105" cy="105" r="55" fill="#2E7D32"/>
      <path d="M 105 145 Q 92 110 100 70 Q 110 95 108 140 Z" fill="#F4F4EF"/>
      <text x="200" y="95" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1B4D1F">Clean and Green</text>
      <text x="200" y="118" font-family="Helvetica" font-size="12" letter-spacing="5" fill="#2E7D32">LAWN CARE</text>
      <text x="200" y="142" font-family="Helvetica" font-size="10" letter-spacing="2" fill="#666">A CLEANER CUT  ·  A GREENER LAWN</text>
