    <g transform="translate(500,970)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <path d="M 30 155 A 80 80 0 0 1 185 155 Z" fill="#1B4D1F"/>
      <path d="M 50 155 A 60 60 0 0 1 165 155 Z" fill="#2E7D32"/>
      <path d="M 105 155 Q 105 130 107 95" stroke="#A5D6A7" stroke-width="3" fill="none"/>
      <path d="M 105 130 Q 85 120 78 100 Q 95 105 108 125 Z" fill="#A5D6A7"/>
      <path d="M 107 110 Q 125 95 138 80 Q 130 100 110 120 Z" fill="#A5D6A7"/>
      <circle cx="148" cy="65" r="8" fill="#FFC107"/>
      <text x="200" y="95" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1B4D1F">Clean and Green</text>
      <text x="200" y="118" font-family="Helvetica" font-size="12" letter-spacing="5" fill="#2E7D32">LAWN CARE</text>
      <text x="200" y="142" font-family="Helvetica" font-style="italic" font-size="10" fill="#666">Stewardship  ·  Craftsmanship</text>
