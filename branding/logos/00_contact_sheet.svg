      <text x="230" y="80" text-anchor="middle" font-family="Helvetica" font-size="36" font-weight="900" fill="#1B4D1F">CLEAN AND</text>
      <text x="230" y="125" font-family="Helvetica" font-size="54" font-weight="900" fill="#2E7D32" text-anchor="middle">GREEN</text>
      <polygon points="120,140 350,140 340,150 110,150" fill="#A5D6A7"/>
      <text x="230" y="170" text-anchor="middle" font-family="Helvetica" font-size="10" letter-spacing="6" fill="#2C2C2C">LAWN CARE  ·  LOCALLY OWNED</text>
