      <text x="195" y="125" font-family="Helvetica" font-size="12" letter-spacing="4" fill="#2E7D32">LAWN CARE  ·  EST. 2026</text>
      <text x="10" y="195" font-weight="700">06 — Sun + Lawn Horizon</text>
    </g>
    <!-- 07 -->
    <g transform="translate(20,750)">
