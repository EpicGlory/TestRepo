      <text x="200" y="123" font-family="Helvetica" font-size="12" letter-spacing="5" fill="#2E7D32">LAWN CARE</text>
      <line x1="200" y1="135" x2="280" y2="135" stroke="#FFC107" stroke-width="3"/>
      <text x="10" y="195" font-weight="700">05 — Hex Monogram</text>
    </g>
    <!-- 06 -->
    <g transform="translate(500,530)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <circle cx="105" cy="110" r="36" fill="#FFC107"/>
      <rect x="40" y="110" width="130" height="9" fill="#A5D6A7"/>
      <rect x="40" y="119" width="130" height="9" fill="#2E7D32"/>
      <rect x="40" y="128" width="130" height="9" fill="#1B4D1F"/>
