    </g>
    <!-- 04 -->
    <g transform="translate(500,310)">
      <rect width="460" height="200" fill="#F4F4EF" stroke="#DDD"/>
      <path d="M 90 165 Q 50 130 75 90 Q 95 55 115 90 Q 140 130 90 165 Z" fill="#2E7D32"/>
      <path d="M 95 90 Q 88 60 100 30 Q 110 55 105 88 Z" fill="#1B4D1F"/>
