      <text x="170" y="125" font-family="Helvetica" font-size="13" letter-spacing="5" fill="#2E7D32">LAWN CARE CO.</text>
      <text x="10" y="195" font-weight="700">04 — Drop &amp; Blade</text>
    </g>
    <!-- 05 -->
    <g transform="translate(20,530)">
