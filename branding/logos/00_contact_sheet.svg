      <path d="M 50 160 Q 45 140 52 125 Q 60 140 58 160 Z" fill="#A5D6A7"/>
      <path d="M 80 160 Q 73 125 85 90  Q 97 125 90 160 Z" fill="#2E7D32"/>
      <path d="M 120 160 Q 112 100 130 50 Q 145 100 132 160 Z" fill="#1B4D1F"/>
