<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="360" fill="#FFFFFF"/>
  <text x="500" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B4D1F">Clean and Green  ·  Mashup of #3 (mow stripes) + #7 (stacked wordmark)</text>

  <!-- A -->
  <g transform="translate(20,60)">
    <rect width="320" height="270" fill="#F4F4EF" stroke="#DDD"/>
    <text x="160" y="70" text-anchor="middle" font-family="Helvetica" font-size="32" font-weight="900" fill="#1B4D1F">CLEAN AND</text>
    <text x="160" y="120" text-anchor="middle" font-family="Helvetica" font-size="50" font-weight="900" fill="#2E7D32">GREEN</text>
    <rect x="40" y="140" width="240" height="9" fill="#A5D6A7"/>
    <rect x="40" y="149" width="240" height="9" fill="#2E7D32"/>
    <rect x="40" y="158" width="240" height="9" fill="#1B4D1F"/>
    <text x="160" y="195" text-anchor="middle" font-family="Helvetica" font-size="10" letter-spacing="5" fill="#2C2C2C">LAWN CARE  ·  LOCALLY OWNED</text>
    <text x="160" y="255" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1B4D1F">A — Stripes as baseline</text>
  </g>

  <!-- B -->
  <g transform="translate(360,60)">
    <rect width="320" height="270" fill="#F4F4EF" stroke="#DDD"/>
    <text x="160" y="55" text-anchor="middle" font-family="Helvetica" font-size="28" font-weight="900" fill="#1B4D1F">CLEAN AND</text>
    <rect x="60" y="68" width="200" height="7" fill="#A5D6A7"/>
    <rect x="60" y="75" width="200" height="7" fill="#2E7D32"/>
    <rect x="60" y="82" width="200" height="7" fill="#1B4D1F"/>
    <text x="160" y="155" text-anchor="middle" font-family="Helvetica" font-size="60" font-weight="900" fill="#2E7D32">GREEN</text>
    <text x="160" y="195" text-anchor="middle" font-family="Helvetica" font-size="10" letter-spacing="5" fill="#2C2C2C">LAWN CARE</text>
    <text x="160" y="255" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1B4D1F">B — Stripes between the lines</text>
  </g>

  <!-- C -->
  <g transform="translate(700,60)">
    <rect width="280" height="270" fill="#F4F4EF" stroke="#DDD"/>
    <rect x="30" y="35" width="220" height="8" fill="#A5D6A7"/>
    <rect x="30" y="43" width="220" height="8" fill="#2E7D32"/>
    <rect x="30" y="51" width="220" height="8" fill="#1B4D1F"/>
    <text x="140" y="105" text-anchor="middle" font-family="Helvetica" font-size="30" font-weight="900" fill="#1B4D1F">CLEAN AND</text>
    <text x="140" y="155" text-anchor="middle" font-family="Helvetica" font-size="52" font-weight="900" fill="#2E7D32">GREEN</text>
    <text x="140" y="195" text-anchor="middle" font-family="Helvetica" font-size="10" letter-spacing="5" fill="#2C2C2C">LAWN CARE</text>
    <text x="140" y="255" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1B4D1F">C — Stripes as banner above</text>
  </g>
</svg>
