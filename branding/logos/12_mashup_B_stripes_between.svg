<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="260" fill="#F4F4EF"/>
  <!-- "CLEAN AND" small on top -->
  <text x="240" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#1B4D1F" letter-spacing="-1">CLEAN AND</text>
  <!-- Mow stripes split the wordmark -->
  <rect x="80" y="70" width="320" height="8" fill="#A5D6A7"/>
  <rect x="80" y="78" width="320" height="8" fill="#2E7D32"/>
  <rect x="80" y="86" width="320" height="8" fill="#1B4D1F"/>
  <!-- Big "GREEN" -->
  <text x="240" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#2E7D32" letter-spacing="-3">GREEN</text>
  <!-- Tagline -->
  <text x="240" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#2C2C2C">LAWN CARE</text>
  <text x="240" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#666">A CLEANER CUT  ·  A GREENER LAWN</text>
</svg>
