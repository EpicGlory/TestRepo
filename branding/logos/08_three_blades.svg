  <path d="M 95 175 Q 88 130 100 90  Q 112 130 105 175 Z" fill="#2E7D32"/>
  <path d="M 140 175 Q 132 110 148 50 Q 165 110 152 175 Z" fill="#1B4D1F"/>
  <!-- Ground line -->
  <line x1="40" y1="178" x2="195" y2="178" stroke="#2C2C2C" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="220" y="100" font-family="'Roboto Slab', Georgia, serif" font-size="30" font-weight="700" fill="#1B4D1F">Clean and Green</text>
  <text x="220" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#2E7D32">LAWN CARE</text>
