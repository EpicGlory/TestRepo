<!-- Single-line "CLEAN AND GREEN TURF" wordmark.
     Useful for sleeves, narrow chest placements, side seams, hat back strap.
     Same color as chest_embroidery_2color. -->
<svg viewBox="0 0 600 80" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#1B4D1F" letter-spacing="-2">CLEAN AND <tspan fill="#2E7D32">GREEN TURF</tspan></text>
</svg>
