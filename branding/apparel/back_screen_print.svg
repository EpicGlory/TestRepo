<!-- Full-back screen print for t-shirts. 10-12" wide at production.
     Full brand lockup matching the website/cards. -->
<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
  <!-- Wordmark -->
  <text x="300" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#1B4D1F" letter-spacing="-2">CLEAN AND</text>
  <text x="300" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#2E7D32" letter-spacing="-2">GREEN TURF</text>

  <!-- Mow stripes -->
  <rect x="100" y="220" width="400" height="16" fill="#A5D6A7"/>
  <rect x="100" y="236" width="400" height="16" fill="#2E7D32"/>
  <rect x="100" y="252" width="400" height="16" fill="#1B4D1F"/>

  <!-- Descriptor -->
  <text x="300" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#2C2C2C">RENOVATION AND LAWN CARE</text>

  <!-- Tagline -->
  <text x="300" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="26" font-weight="700" letter-spacing="3" fill="#2E7D32">Seed.  Feed.  Succeed.</text>

  <!-- Phone (anchor at bottom — works on the back of a shirt) -->
  <text x="300" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#1B4D1F">801.358.7820  ·  cleanandgreenturf.com</text>
</svg>
