<!-- PRINT-READY for recycled cream paper. No background fill; cream paper shows through. -->
<!-- Standard US business card: 3.5 x 2 inches (700 x 400 at 200dpi). Add 1/8 inch bleed at print. -->
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Wordmark -->
  <text x="350" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#1B4D1F" letter-spacing="-2">CLEAN AND</text>
  <text x="350" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#2E7D32" letter-spacing="-2">GREEN TURF</text>

  <!-- Mow stripes -->
  <rect x="100" y="245" width="500" height="14" fill="#A5D6A7"/>
  <rect x="100" y="259" width="500" height="14" fill="#2E7D32"/>
  <rect x="100" y="273" width="500" height="14" fill="#1B4D1F"/>

  <!-- Descriptor -->
  <text x="350" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="6" fill="#2C2C2C">RENOVATION AND LAWN CARE</text>

  <!-- Tagline -->
  <text x="350" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="18" font-weight="700" letter-spacing="3" fill="#2E7D32">Seed.  Feed.  Succeed.</text>
</svg>
