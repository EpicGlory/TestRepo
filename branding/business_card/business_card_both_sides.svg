<!-- Side-by-side preview of both card sides. Print files are the individual SVGs. -->
<svg viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="1500" height="520" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="750" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B4D1F">Clean and Green  ·  Business Card  ·  3.5" × 2" (with 1/8" bleed at print)</text>

  <!-- FRONT -->
  <g transform="translate(40,80)">
    <rect width="700" height="400" fill="#F4F4EF" stroke="#CCC" stroke-width="2"/>
    <text x="350" y="140" text-anchor="middle" font-family="Helvetica" font-size="76" font-weight="900" fill="#1B4D1F" letter-spacing="-2">CLEAN AND</text>
    <text x="350" y="225" text-anchor="middle" font-family="Helvetica" font-size="76" font-weight="900" fill="#2E7D32" letter-spacing="-2">GREEN TURF</text>
    <rect x="100" y="245" width="500" height="14" fill="#A5D6A7"/>
    <rect x="100" y="259" width="500" height="14" fill="#2E7D32"/>
    <rect x="100" y="273" width="500" height="14" fill="#1B4D1F"/>
    <text x="350" y="320" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" letter-spacing="6" fill="#2C2C2C">RENOVATION AND LAWN CARE</text>
    <text x="350" y="355" text-anchor="middle" font-family="Helvetica" font-style="italic" font-size="18" font-weight="700" letter-spacing="3" fill="#2E7D32">Seed.  Feed.  Succeed.</text>
    <text x="350" y="430" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#666">FRONT</text>
  </g>

  <!-- BACK -->
  <g transform="translate(760,80)">
    <rect width="700" height="400" fill="#F4F4EF" stroke="#CCC" stroke-width="2"/>
    <g transform="translate(40,45)">
      <text x="0" y="0" font-family="Helvetica" font-size="17" font-weight="900" fill="#1B4D1F" letter-spacing="-0.5">CLEAN AND GREEN TURF</text>
      <text x="0" y="22" font-family="Helvetica" font-size="13" font-weight="700" letter-spacing="2" fill="#2E7D32">RENOVATION AND LAWN CARE</text>
    </g>
    <text x="350" y="160" text-anchor="middle" font-family="Helvetica" font-size="48" font-weight="900" fill="#1B4D1F" letter-spacing="-1">Ryan Tucker</text>
    <text x="350" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" letter-spacing="6" fill="#2E7D32">OWNER</text>
    <rect x="200" y="210" width="300" height="9" fill="#A5D6A7"/>
    <rect x="200" y="219" width="300" height="9" fill="#2E7D32"/>
    <rect x="200" y="228" width="300" height="9" fill="#1B4D1F"/>
    <text x="350" y="280" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#2C2C2C" letter-spacing="2">801.358.7820</text>
    <text x="350" y="310" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#2C2C2C">ryantucker@cleanandgreenturf.com</text>
    <text x="350" y="340" text-anchor="middle" font-family="Helvetica" font-size="13" letter-spacing="4" fill="#666">KAYSVILLE,  UTAH</text>
    <text x="350" y="430" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#666">BACK</text>
  </g>
</svg>
